<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120540" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chroma Coil" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Chroma Coil</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Chroma Coil game board" data-i18n-aria="board.label"></canvas>

      <div id="hud" hidden>
        <div class="hud-left">
          <div class="score-label" data-i18n="hud.score">Score</div>
          <div class="score" id="score">0</div>
          <div class="meter" aria-label="Level progress" data-i18n-aria="hud.progress"><div class="meter-fill" id="meter-fill"></div></div>
        </div>
        <div class="hud-right">
          <button id="btn-pause" class="icon-btn" aria-label="Pause" data-i18n-aria="hud.pause">
            <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
          </button>
          <button class="icon-btn" data-open-settings aria-label="Settings" data-i18n-aria="btn.settings">
            <svg viewBox="0 0 24 24" class="stroke"><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2.2" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg>
          </button>
        </div>
      </div>

      <section id="screen-title" class="screen">
        <div class="card">
          <h1 class="logo"><span class="l1">Chroma</span><span class="l2">Coil</span></h1>
          <p class="tag" data-i18n="title.tag">Shoot marbles into the rolling chain. Match 3 or more of a colour to pop them before they reach the vortex!</p>
          <button id="btn-play" class="btn primary" data-i18n="title.play">Play</button>
          <button class="btn ghost" data-open-settings data-i18n="btn.settings">Settings</button>
          <p class="hint controls-hint"></p>
          <p class="phone-note" id="phone-note" data-i18n="title.phoneNote" hidden>Best played on a tablet or desktop. Phones work too: the board reshapes itself to fit when you rotate.</p>
        </div>
      </section>

      <section id="screen-pause" class="screen" hidden>
        <div class="card">
          <h2 data-i18n="pause.title">Paused</h2>
          <button id="btn-resume" class="btn primary" data-i18n="btn.resume">Resume</button>
          <button class="btn ghost" data-restart data-i18n="btn.restart">Restart</button>
          <button class="btn ghost" data-open-settings data-i18n="btn.settings">Settings</button>
          <p class="hint controls-hint"></p>
        </div>
      </section>

      <section id="screen-result" class="screen" hidden>
        <div class="card">
          <h2 id="result-title">Cleared!</h2>
          <p class="result-score"><span id="result-score">0</span><small data-i18n="result.points">points</small></p>
          <p class="best" id="result-best"></p>
          <button class="btn primary" data-restart data-i18n="btn.playAgain">Play again</button>
          <button class="btn ghost" data-open-settings data-i18n="btn.settings">Settings</button>
        </div>
      </section>

      <section id="screen-settings" class="screen" hidden>
        <div class="card wide">
          <h2 data-i18n="settings.title">Settings</h2>
          <h3 data-i18n="settings.theme">Theme</h3>
          <div class="themes" id="theme-list" role="radiogroup" aria-label="Theme" data-i18n-aria="settings.theme"></div>
          <h3 data-i18n="settings.language">Language</h3>
          <div class="langs" id="lang-list" role="radiogroup" aria-label="Language" data-i18n-aria="settings.language"></div>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="opt-sound" /><span class="switch"></span><span data-i18n="settings.sound">Sound effects</span></label>
            <label class="toggle"><input type="checkbox" id="opt-aim" /><span class="switch"></span><span data-i18n="settings.aim">Aim guide</span></label>
          </div>
          <button id="btn-settings-done" class="btn primary" data-i18n="btn.done">Done</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
